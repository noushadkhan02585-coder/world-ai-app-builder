name: World AI Cloud APK Builder Engine

on:
  repository_dispatch:
    types: [trigger-build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Setup Java Development Kit (JDK 17)
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter SDK Environment
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Dynamic SDK Keys Configuration Injection
      env:
        GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
      run: |
        mkdir -p assets
        echo '$CLIENT_PAYLOAD' > assets/app_config.json
        echo "Successfully injected Three-Dots dynamic settings configuration!"

    - name: Compile Real Production APK
      run: |
        flutter pub get
        flutter build apk --release

    - name: Upload Generated APK To Secure Artifact Storage
      uses: actions/upload-artifact@v3
      with:
        name: world-ai-generated-app
        path: build/app/outputs/flutter-apk/app-release.apk
