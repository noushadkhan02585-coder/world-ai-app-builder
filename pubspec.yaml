name: world_ai_generated_app
description: "A production ready multi-framework app generated by World AI Builder."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Dynamic Integrations via Three-Dots Menu
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  agora_rtc_engine: ^6.3.0
  google_mobile_ads: ^4.0.0
  truecaller_sdk: ^0.0.7
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_config.json
